#
# Pull request and main CI. The jobs (Arch, Lint, Nix) are the shared C++ CI
# of the workspace repository (.github/workflows/cpp-ci.yml), which says what
# each one does. This file passes only what differs here.
#
# Fedora runs too: Arch ships the newest Qt, so on its own it passes code that
# calls an API added after the Qt the distro packages build with.
# phosphor-libs comes from the commit cmake/PhosphorEngineLibsDependencies.cmake
# pins, so its tests run here too. PlasmaZones, which builds this tree from a
# pinned commit, tests it again inside its own build, against the data it
# ships.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: phosphor-works/workspace/.github/workflows/cpp-ci.yml@v1
    with:
      pin-file: cmake/PhosphorEngineLibsDependencies.cmake
      fedora: true
      nix-verify: |
        libs=$(find result/lib -maxdepth 1 -name 'libPhosphor*.so*' | wc -l)
        echo "Shared libraries: $libs"
        test "$libs" -gt 0 || { echo "::error::the package installed no libPhosphor*.so"; exit 1; }
        test -e result/lib/cmake/PhosphorEngineRuntime || { echo "::error::the package installed no PhosphorEngineRuntime CMake package"; exit 1; }
